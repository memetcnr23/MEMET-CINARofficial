<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">CNR Müzik TV</title>
<desc id="desc">CNR Müzik TV channel logo with red broadcast swooshes and white lettering.</desc>
<defs>
  <linearGradient id="red" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff4b55"/><stop offset=".48" stop-color="#e30620"/><stop offset="1" stop-color="#9d0014"/></linearGradient>
  <linearGradient id="silver" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#d8d8dc"/><stop offset="1" stop-color="#9d9da4"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset dy="5" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g fill="none" stroke="url(#red)" stroke-linecap="round">
  <path d="M75 222 C180 42 495 36 760 87 C963 126 1085 112 1148 173" stroke-width="22"/>
  <path d="M77 258 C230 340 520 350 768 300 C943 265 1081 271 1141 214" stroke-width="14"/>
  <path d="M119 208 C250 79 469 72 680 102" stroke="#fff" stroke-opacity=".78" stroke-width="3"/>
</g>
<g fill="url(#silver)" stroke="#111" stroke-width="7" paint-order="stroke fill" filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif" font-weight="900">
  <text x="62" y="290" font-size="278" letter-spacing="-20">CNR</text>
</g>
<!-- Santa cap fitted to the upper arc of the C: this is part of the master logo, not a floating sticker. -->
<g id="cnr-santa-hat" filter="url(#cnrHatShadow)">
  <defs>
    <linearGradient id="cnrHatRed" x1="0" y1="0" x2=".86" y2="1">
      <stop offset="0" stop-color="#ff7378"/>
      <stop offset=".28" stop-color="#ec1b2b"/>
      <stop offset=".68" stop-color="#b60019"/>
      <stop offset="1" stop-color="#76000f"/>
    </linearGradient>
    <linearGradient id="cnrHatFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".42" stop-color="#f5f7f8"/>
      <stop offset=".78" stop-color="#dce2e7"/>
      <stop offset="1" stop-color="#aeb9c2"/>
    </linearGradient>
    <radialGradient id="cnrHatPom" cx=".32" cy=".22" r=".78">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".62" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#bec8cf"/>
    </radialGradient>
    <filter id="cnrHatShadow" x="-20%" y="-50%" width="150%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feOffset dy="2.5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M113 106 C126 77 143 47 179 31 C173 57 190 78 235 102 C198 91 153 91 113 106 Z"
        fill="url(#cnrHatRed)" stroke="#790515" stroke-width="3" stroke-linejoin="round"/>
  <path d="M132 79 C146 52 159 42 177 34" fill="none" stroke="#ff9da0" stroke-width="4.5" stroke-linecap="round" opacity=".56"/>
  <path d="M117 108 C150 87 193 84 234 104" fill="none" stroke="#7c0715" stroke-width="22" stroke-linecap="round" opacity=".42"/>
  <path d="M115 103 C150 82 193 80 236 99" fill="none" stroke="url(#cnrHatFur)" stroke-width="17" stroke-linecap="round"/>
  <path d="M120 100 C153 82 192 80 232 97" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="1.5 5" opacity=".88"/>
  <path d="M123 108 C155 93 196 91 229 105" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <g fill="url(#cnrHatPom)">
    <circle cx="178" cy="32" r="13"/>
    <circle cx="168" cy="32" r="8.5"/>
    <circle cx="181" cy="22" r="8"/>
    <circle cx="189" cy="32" r="8"/>
    <circle cx="176" cy="42" r="8"/>
    <circle cx="165" cy="40" r="6"/>
  </g>
  <g fill="#fff" opacity=".58">
    <circle cx="126" cy="99" r="2.5"/><circle cx="136" cy="94" r="2"/><circle cx="148" cy="89" r="2.1"/>
    <circle cx="162" cy="86" r="1.7"/><circle cx="177" cy="85" r="1.8"/><circle cx="193" cy="87" r="1.6"/>
    <circle cx="207" cy="91" r="1.8"/><circle cx="221" cy="97" r="2.2"/>
  </g>
</g>
<path d="M192 190 L192 252 L249 221 Z" fill="url(#red)" stroke="#151515" stroke-width="6"/>
<g fill="url(#silver)" stroke="#171717" stroke-width="3">
  <rect x="385" y="74" width="18" height="83" rx="3"/>
  <rect x="410" y="49" width="18" height="108" rx="3"/>
  <rect x="435" y="28" width="18" height="129" rx="3"/>
  <rect x="460" y="61" width="18" height="96" rx="3"/>
  <rect x="485" y="93" width="18" height="64" rx="3"/>
</g>
<g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif" font-style="italic" font-weight="900">
  <text x="650" y="260" font-size="116" fill="#fff" stroke="#111" stroke-width="6" paint-order="stroke fill">Müzik</text>
  <rect x="944" y="130" width="206" height="132" rx="18" fill="url(#red)" stroke="#171717" stroke-width="7"/>
  <text x="965" y="248" font-size="120" fill="#fff" stroke="#7d0011" stroke-width="3" paint-order="stroke fill">TV</text>
</g>
<text x="1148" y="123" fill="#fff" stroke="#151515" stroke-width="3" paint-order="stroke fill" font-family="Arial,sans-serif" font-size="34" font-weight="700">®</text>
</svg>